<!DOCTYPE html>
<html lang="en-US">

{% include head.html %}

<body>
  <section>

    <nav class="breadcrumb">
      <p>
        <span><a href="/">home</a> &nbsp; / &nbsp;</span>
        <span><a href="/posts">posts</a> &nbsp; / &nbsp; </span>
        <span><a href="{{ page.url }}">{{ page.url | split: '/posts/'}}</a></span>
      </p>
    </nav>

    <article>

      <h1>{{ page.title }}</h1>

      <p><small>Published on {{ page.date | date: "%B %d, %Y" }}</small><br><small>Categories: {{ page.categories |
          join: ", " }}</small></p>

      <div class="post-content">
        {{ content }}
      </div>
    </article>

  </section>
</body>

</html>
